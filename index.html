<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101114">
<title>New TR Sign Ops</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15171c;--mut:#69707d;--paper:#f3f4f7;--card:#fff;--line:#e2e5ea;--soft:#eceef2;
  --red:#e0231b;--red-bg:#fdebea;--amb:#a86400;--amb-bg:#fff2d8;--grn:#0f7a55;--grn-bg:#dff4ea;
  --fascia:#101114;--fascia-2:#1b1d22;--fascia-mut:#9aa0ab;
  --r:12px;--side:232px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.55 'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;letter-spacing:.005em;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- ประตูเข้า ---------- */
.gate{min-height:100%;display:grid;place-items:center;background:var(--fascia);padding:24px}
.gate form{width:min(380px,100%);text-align:center;color:#fff}
.gate img{height:84px;filter:drop-shadow(0 0 18px rgba(224,35,27,.55))}
.gate h1{font-size:26px;margin:18px 0 4px;font-weight:700}
.gate p{color:var(--fascia-mut);margin:0 0 22px}
.gate input{width:100%;background:var(--fascia-2);border:1px solid #33363d;border-radius:var(--r);padding:13px 14px;color:#fff;text-align:center;font-size:17px;letter-spacing:1px}
.gate button{width:100%;margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:var(--r);padding:13px;font-weight:600;font-size:16px}
.gate .bad{color:#ff8f89;min-height:22px;margin-top:10px;font-size:14px}

/* ---------- โครง ---------- */
.app{min-height:100%;display:grid;grid-template-columns:var(--side) 1fr}
.side{background:var(--fascia);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.brand img{height:40px}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:12px;color:var(--fascia-mut)}
.nav{background:none;border:0;color:#c9cdd4;text-align:left;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:500;position:relative}
.nav:hover{background:var(--fascia-2);color:#fff}
.nav.on{background:var(--fascia-2);color:#fff}
.nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--red);box-shadow:0 0 10px 1px rgba(224,35,27,.9)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav i{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;background:var(--red);color:#fff;border-radius:99px;padding:1px 8px}
.nav i:empty{display:none}
.side .grow{flex:1}
.side label{font-size:12px;color:var(--fascia-mut);padding:0 8px}
.side input{width:100%;margin-top:4px;background:var(--fascia-2);border:1px solid #33363d;border-radius:9px;padding:8px 10px;color:#fff}
.whoami{font-size:13px;color:var(--fascia-mut);padding:0 8px}.whoami b{color:#fff;font-weight:600}
.side .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 0;font-size:12px;color:var(--fascia-mut)}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:12px}
.app>div{min-width:0}
html,body{overflow-x:clip}
main{padding:22px 26px 40px;min-width:0;max-width:100%}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:26px;line-height:1.2;font-weight:700}
.top p{margin:2px 0 0;color:var(--mut);font-size:14px}
.top .sp{flex:1}
.tabs{display:none}
.mobhead{display:none}

/* ---------- ชิ้นส่วน ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c4c8d0}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:13.5px}
.fld{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .fld[type=search]{flex:1 1 220px;max-width:340px}
.drange{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut)}.fcount{font-size:13.5px;color:var(--mut)}
.bar label{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center}
.msg{background:var(--red-bg);color:#a1160f;padding:10px 14px;border-radius:var(--r);margin-bottom:14px}
.msg.ok{background:var(--grn-bg);color:var(--grn)}
.pill{display:inline-block;font-size:12px;line-height:20px;border-radius:6px;padding:0 7px;background:var(--soft);color:#3b404a;white-space:nowrap}
.pill.r{background:var(--red-bg);color:#b31a13}.pill.w{background:var(--amb-bg);color:var(--amb)}.pill.g{background:var(--grn-bg);color:var(--grn)}.pill.k{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;white-space:nowrap;font-size:14px}
.chip b{font-weight:600;margin-left:5px;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on b{color:#fff}

/* ---------- บอร์ด ---------- */
#colchips{display:none}
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px;height:calc(100vh - 176px);min-height:320px}
.col{flex:1 0 165px;max-width:340px;max-height:100%;overflow-y:auto;background:var(--soft);border-radius:14px;padding:0 8px 8px;scrollbar-width:thin}
.col h3{position:sticky;top:0;background:var(--soft);z-index:1;padding:10px 6px 8px;margin:0 -2px 2px!important}
.col h3{margin:4px 6px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.col h3 b{font-size:12px;background:var(--card);border-radius:99px;padding:0 8px;line-height:20px}
.col h3{flex-wrap:wrap;white-space:nowrap}
.col h3 em{flex-basis:100%;font-style:normal;font-size:12px;color:var(--mut);font-weight:500}
.empty{color:var(--mut);font-size:13.5px;padding:10px 8px}
.job{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px 10px 14px;margin-bottom:8px;position:relative}
.job::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:3px;border-radius:3px;background:#cfd3da}
.job.u::before{background:var(--red)}.job.s::before{background:#e7a41c}.job.f{opacity:.65}
.job:hover{border-color:#bfc4cc;box-shadow:0 2px 8px rgba(21,23,28,.06)}
.job .cu{font-weight:600;line-height:1.3}
.job .ti{font-size:14px;color:#3b404a;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job .cu,.job .ti{overflow-wrap:anywhere}
.job .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.job .mt{font-size:12.5px;color:var(--mut);margin-top:6px}

/* ---------- รายการต้องตาม ---------- */
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 120px auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who b{display:block;line-height:1.3;font-weight:600}
.row .who span{font-size:13.5px;color:#3b404a}
.row .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .act{display:flex;gap:6px;justify-content:flex-end}
.row input,.row select{width:100%}
.days{font-weight:600}
.days.hot{color:var(--red)}

/* ---------- ตัวเลขหัวหน้า ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.kpi .n{font-size:28px;font-weight:700;line-height:1.15}
.kpi .n.sm{font-size:20px;line-height:1.6}
.kpi .l{font-size:13.5px;color:var(--mut)}
.kpi.hot .n{color:var(--red)}.kpi.warm .n{color:var(--amb)}
h2{font-size:17px;margin:24px 0 10px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12.5px;padding:9px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line);padding:9px 8px;vertical-align:top}
tr:first-child+tr td{border-top:0}
td.num,th.num{text-align:right;white-space:nowrap}
td select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;max-width:180px;background:var(--card)}
.meter{display:flex;align-items:center;gap:8px;min-width:110px}
.meter i{display:block;height:8px;border-radius:8px;background:var(--grn);min-width:2px}
.bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bars div{display:grid;grid-template-columns:minmax(120px,240px) 1fr 34px;gap:10px;align-items:center;padding:3px 0;font-size:14px}
.bars i{display:block;height:10px;border-radius:10px;background:var(--ink)}
.bars b{text-align:right;font-weight:600}
.digest{white-space:pre-wrap;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* ---------- แผงรายละเอียด ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,17,20,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:21;box-shadow:-12px 0 40px rgba(16,17,20,.18);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer header{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header div{flex:1;min-width:0}
.drawer h2{margin:0;font-size:19px;line-height:1.3}
.drawer header p{margin:3px 0 0;color:#3b404a}
.x{border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
.drawer .body{padding:14px 20px;overflow-y:auto;flex:1}
.drawer dl{margin:0}
.drawer dt{font-size:12.5px;color:var(--mut);margin-top:12px}
.drawer dd{margin:1px 0 0;white-space:pre-wrap}
.drawer .edit{margin-top:16px;padding-top:6px;border-top:1px dashed var(--line)}
.drawer .edit label{display:block;font-size:12.5px;color:var(--mut);margin-top:10px}
.drawer .edit .fld{display:block;width:100%;margin-top:3px;color:var(--ink);font-size:15px}
.drawer footer{padding:12px 20px calc(64px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.drawer footer .btn{flex:1;padding:10px}

dialog{border:0;border-radius:16px;padding:20px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(16,17,20,.45)}
dialog h2{margin:0 0 4px}
dialog label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
dialog .fld{display:block;width:100%;margin-top:3px;color:var(--ink)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.busy{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:6px 16px;font-size:13.5px;z-index:30}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;min-width:0}
.dgrid .dcard{margin-bottom:0}
.dcard h2{margin:0;font-size:16.5px}
.dsub{margin:2px 0 12px;color:var(--mut);font-size:13.5px}
.dnote{margin:12px 0 0;color:var(--mut);font-size:12.5px;line-height:1.5}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}.dhead span{color:var(--mut);font-size:13.5px}
.hb{display:grid;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(84px,120px) 1fr auto auto;gap:10px;align-items:center;font-size:14px;padding:2px 4px;border-radius:8px}
.hbr:hover{background:var(--soft)}
.hbt{height:12px;background:var(--soft);border-radius:12px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--ink);border-radius:12px}
.hbr b{font-weight:600;white-space:nowrap;text-align:right}.hbr em{font-style:normal;color:var(--mut);font-size:12.5px;white-space:nowrap;min-width:70px;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles div{background:var(--paper);border-radius:12px;padding:12px}
.tiles b{display:block;font-size:24px;line-height:1.2}.tiles span{display:block;font-size:13.5px}.tiles small{color:var(--mut);font-size:12px}
.dt{font-size:14px}.dt th{border-bottom:1px solid var(--line)}
.dt tr.click{cursor:pointer}.dt tr.click:hover td{background:var(--paper)}
.mut{color:var(--mut);font-size:13px}
td.late{color:var(--red);font-weight:600}
.meter span{display:inline-block;width:90px;height:8px;background:var(--soft);border-radius:8px;overflow:hidden;vertical-align:middle}.meter span i{display:block;height:100%;background:var(--grn)}
.kpi.good .n{color:var(--grn)}
.dt td:first-child{min-width:190px}.dt td,.dt th{white-space:nowrap}.dt td:first-child{white-space:normal}
.dcard .digest{border:0;padding:0;background:none}
@media(max-width:860px){.tiles{grid-template-columns:1fr 1fr 1fr;gap:6px}.tiles b{font-size:18px}.hbr{grid-template-columns:78px 1fr auto}.hbr em{display:none}.dcard{padding:14px 12px}}
/* ---------- มือถือ ---------- */
@media(max-width:860px){
  .app{display:block}
  .side{display:none}
  .mobhead{display:flex;align-items:center;gap:10px;background:var(--fascia);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--red)}
  .mobhead img{height:30px}.mobhead b{flex:1}
  .mobhead input{width:108px;background:var(--fascia-2);border:1px solid #33363d;border-radius:8px;padding:5px 8px;color:#fff;font-size:14px}
  .mobhead button{background:none;border:0;color:#fff;font-size:20px;padding:0 4px}
  main{padding:16px 12px 150px}
  .top h1{font-size:22px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--fascia);z-index:15;padding-bottom:calc(54px + env(safe-area-inset-bottom))}
  .tabs .nav{flex-direction:column;gap:2px;font-size:11.5px;padding:8px 2px 7px;border-radius:0;text-align:center;justify-content:center}
  .tabs .nav.on{background:none}
  .tabs .nav.on::before{left:25%;right:25%;top:0;bottom:auto;width:auto;height:3px}
  .tabs .nav i{position:absolute;top:4px;left:54%;margin:0;padding:0 6px;font-size:11px}
  #colchips{display:flex}
  .board{display:block;overflow:visible;height:auto;min-height:0}
  .col{display:none;background:none;padding:0;max-width:none;max-height:none;overflow:visible}
  .col.cur{display:block}
  .col h3{display:none}
  .row{grid-template-columns:1fr auto;gap:6px 10px}
  .row .why{grid-column:1/-1}
  .row .who{grid-column:1/-1}
  .row .amt{text-align:left}
  .row .act{grid-column:1/-1;justify-content:stretch}
  .row .act .btn{flex:1;padding:8px}
  .drawer{top:auto;left:0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .two{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.drawer{animation:none}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="gatef">
    <img src="logo.png" alt="New TR Sign">
    <h1>New TR Sign Ops</h1>
    <p>ใส่รหัสส่วนตัวของคุณเพื่อเข้าดูงาน</p>
    <input id="gk" autocomplete="off" autocapitalize="off" placeholder="รหัสของคุณ" aria-label="รหัสของคุณ" required>
    <button type="submit">เข้าใช้งาน</button>
    <div class="bad" id="gbad" role="alert"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="logo.png" alt=""><div><b>New TR Sign</b><span>ติดตามงานและลูกค้า</span></div></div>
    <div id="navs"></div>
    <div class="grow"></div>
    <label class="mewrap">ชื่อของคุณ (ใช้จดว่าใครตามงาน)<input class="me" placeholder="เช่น นิว"></label>
    <div class="whoami" hidden></div>
    <div class="foot"><span class="upd"></span><span><button class="link" data-act="reload">รีเฟรช</button> · <button class="link" data-act="logout">ออก</button></span></div>
  </aside>
  <div>
    <div class="mobhead"><img src="logo.png" alt=""><b>New TR Sign</b><input class="me mewrap" placeholder="ชื่อคุณ" aria-label="ชื่อของคุณ"><span class="whoami" hidden></span><button data-act="reload" aria-label="รีเฟรช">↻</button></div>
    <main>
      <div class="top"><div><h1 id="ttl"></h1><p id="sub"></p></div><span class="sp"></span><button class="btn pri" data-act="openAdd">+ เพิ่มงาน</button></div>
      <div id="msg" class="msg" role="alert" hidden></div>
      <section id="p1">
        <div class="bar">
          <input class="fld" type="search" id="fq" placeholder="ค้นหาลูกค้า งาน หรือเลขใบเสนอราคา">
          <select class="fld" id="fs" aria-label="ที่มา"></select>
          <select class="fld" id="fo" aria-label="ผู้ดูแล"></select>
          <select class="fld" id="ft" aria-label="Supplier"></select>
          <select class="fld" id="fd" aria-label="ช่วงเวลา"><option value="">ทุกช่วงเวลา</option><option value="today">วันนี้</option><option value="7">7 วันล่าสุด</option><option value="30">30 วันล่าสุด</option><option value="month">เดือนนี้</option><option value="lastmonth">เดือนที่แล้ว</option><option value="custom">กำหนดเอง…</option></select>
          <select class="fld" id="fdk" aria-label="นับจากวันที่" hidden><option value="opened">ตามวันที่รับงาน</option><option value="touch">ตามวันที่คุยล่าสุด</option><option value="wonAt">ตามวันที่ได้งาน</option><option value="closedAt">ตามวันที่จบงาน</option></select>
          <span id="fdc" class="drange" hidden><input class="fld" type="date" id="fd1" aria-label="ตั้งแต่วันที่"><span>ถึง</span><input class="fld" type="date" id="fd2" aria-label="ถึงวันที่"></span>
          <label><input type="checkbox" id="fh" checked> ซ่อนงานที่ปิดแล้ว</label>
          <button class="btn sm" id="fclr" data-act="clearFil" hidden>ล้างตัวกรอง</button>
          <span class="fcount" id="fcount"></span>
        </div>
        <div class="chips" id="colchips"></div>
        <div class="board" id="board"></div>
      </section>
      <section id="p2" hidden></section>
      <section id="p3" hidden></section>
      <section id="p4" hidden></section>

<script>
var API='https://script.google.com/macros/s/AKfycbwdAIboIZe9V6BaYX_yz8ZFXTiW4YtXcqMp2G5Ky-i4XCsSfVNbg5p5QhxHAW9Zki0c/exec';
var LEAD=['ขอราคา','เสนอราคา','รอแบบ'];
var PROD='สั่งผลิต (ชีตสรุปยอด)';
var FOLLOW_DAYS=2, LOST_DAYS=7;
var REASONS=['','ราคา','เสนอราคาแล้วลูกค้าเงียบ','ร้านถามรายละเอียดแล้วลูกค้าเงียบ','ร้านตอบช้าหรือไม่ได้ตอบ','ทักมาเช็คราคาเฉยๆ','เวลาไม่ทัน','ไปทำที่อื่น','อื่นๆ'];
var SOURCES=['Facebook','Instagram','LINE OA แชตเดี่ยว','LINE OA กลุ่มลูกค้า','คอนเนคชัน','โทร / หน้าร้าน','อื่นๆ'];
var ROLES={NEW:'OWNER',TOR:'MANAGER',JUMP:'SUPPLIER'};
var OWNERS=['TOR','NEW','JUMP'], DEFAULT_OWNER='TOR';
function ownerSel(j,cls){
  if(DATA.scoped)return '<span class="pill">ดูแลโดย '+esc(j.owner)+'</span>';
  var l=OWNERS.indexOf(j.owner)<0?OWNERS.concat([j.owner]):OWNERS;
  return '<select class="'+(cls||'fld')+'" data-f="owner" data-id="'+esc(j.jobId)+'" aria-label="ผู้ดูแล">'+l.map(function(o){return '<option'+(o===j.owner?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
}
var TABS=[
  {n:1,t:'บอร์ดงาน',s:'งานทุกชิ้น แยกตามขั้นตอน แตะการ์ดเพื่อดูและแก้ไข',i:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>'},
  {n:2,t:'ต้องตามวันนี้',s:'งานที่ควรทักลูกค้าหรือตามเงินตอนนี้',i:'<path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>'},
  {n:3,t:'ทักแล้วหาย',s:'ลูกค้าที่ถามราคาแล้วเงียบ เก็บเหตุผลไว้วิเคราะห์',i:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8"/><path d="M12 17h.01"/>'},
  {n:4,t:'สรุปภาพรวม',s:'ตัวเลขรวม ที่มาของลูกค้า และงานในมือ Supplier',i:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/>'}
];
var KEY='', ME='', DATA=null, TAB=1, CUR=null, WHY='', FIL={q:'',src:'',own:'',team:'',dr:'',dk:'opened',d1:'',d2:'',hide:true,col:''};
try{KEY=localStorage.getItem('ntr_key')||'';ME=localStorage.getItem('ntr_me')||'';}catch(x){}
(function(){var m=location.search.match(/[?&]k=([\w-]+)/);if(m){KEY=m[1];try{localStorage.setItem('ntr_key',KEY);}catch(x){}history.replaceState(null,'',location.pathname);}})();

function $(i){return document.getElementById(i);}
function all(s){return [].slice.call(document.querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function baht(n){return n?Number(n).toLocaleString('th-TH')+' บาท':'';}
function amtLbl(){return DATA&&DATA.scoped?'ราคาทุน ':'';}
function ms(iso){var t=iso?new Date(iso).getTime():0;return isNaN(t)?0:t;}
function dAgo(t){return t?(Date.now()-t)/864e5:null;}
function agoTxt(t){var d=dAgo(t);if(d===null)return '-';if(d<1){var h=Math.floor(d*24);return h<1?'เมื่อสักครู่':h+' ชม.ก่อน';}return Math.floor(d)+' วันก่อน';}
function isOpen(j){return j.status!=='เสร็จ'&&j.status!=='ยกเลิก';}
function isLead(j){return LEAD.indexOf(j.status)>=0&&j.source!==PROD;}
function touch(j){return Math.max(ms(j.lastChat),ms(j.followed))||0;}
function silent(j){var t=touch(j);return t?dAgo(t):null;}
function byId(id){return DATA.jobs.filter(function(j){return j.jobId===id;})[0];}
function followWhy(j){
  if(!isOpen(j))return '';
  var s=silent(j);
  if(isLead(j)&&s!==null&&s>=FOLLOW_DAYS)return j.lastReply==='ลูกค้า'||j.lastReply==='ตอบอัตโนมัติเท่านั้น'?'ลูกค้ารอคำตอบ':(j.status==='เสนอราคา'?'ตามผลหลังเสนอราคา':'ตามให้ส่งข้อมูล');
  if(j.status==='วางบิล/รอเงิน')return 'ตามเงิน';
  if(j.payment==='เปิด PO'&&(j.status==='กำลังผลิต'||j.status==='รอติดตั้ง'))return 'เปิด PO ยังไม่ได้เงิน';
  if(j.urgent)return 'ต้องรีบดู';
  if(j.blockers)return 'ติดปัญหา';
  return '';
}
function whyCls(w){return w==='ลูกค้ารอคำตอบ'||w==='ต้องรีบดู'?'r':w==='ตามเงิน'||w==='เปิด PO ยังไม่ได้เงิน'?'g':'w';}
function leadKind(j){
  if(j.status==='ยกเลิก')return 'ยกเลิก';
  if(j.lastReply==='ตอบอัตโนมัติเท่านั้น'||j.lastReply==='ลูกค้า')return 'ไม่มีคนตอบ';
  if(j.status==='เสนอราคา')return 'เสนอราคาแล้วเงียบ';
  return 'ร้านตอบแล้วลูกค้าเงียบ';
}
function lostList(){return DATA.jobs.filter(function(j){
  if(j.source===PROD)return false;
  if(j.status==='ยกเลิก')return true;
  var s=silent(j);return isLead(j)&&s!==null&&s>=LOST_DAYS;});}
/* ชีตแปลงเลขใบเสนอราคาแบบ 03-6910 เป็นวันที่ ต้องแปลงกลับ */
function fixQuote(q){var m=/^(\d{4})-\d\d-\d\dT/.exec(q||'');if(!m)return q||'';var d=new Date(new Date(q).getTime()+7*36e5);var mo=d.getUTCMonth()+1;return (mo<10?'0':'')+mo+'-'+d.getUTCFullYear();}

/* ---------- เชื่อมเซิร์ฟเวอร์ ---------- */
function url(){return API+'?k='+encodeURIComponent(KEY);}
function show(t,ok){var m=$('msg');m.textContent=t||'';m.hidden=!t;m.className='msg'+(ok?' ok':'');}
function gate(bad){$('app').hidden=true;$('gate').hidden=false;$('gbad').textContent=bad||'';$('gk').focus();}
function load(first){
  if(!KEY){gate();return;}
  fetch(url()).then(function(r){return r.json();}).then(function(d){
    if(!d||d.error){KEY='';try{localStorage.removeItem('ntr_key');}catch(x){}gate('รหัสไม่ถูกต้อง ขอรหัสใหม่จากเจ้าของร้าน');return;}
    d.jobs.forEach(function(j){j.quote=fixQuote(j.quote);if(!j.owner)j.owner=DEFAULT_OWNER;});
    if(d.user){ME=d.user;all('.mewrap').forEach(function(e){e.hidden=true;});all('.whoami').forEach(function(e){e.hidden=false;e.innerHTML='เข้าใช้ในชื่อ <b>'+esc(d.user)+'</b>'+(ROLES[d.user]?' · '+ROLES[d.user]:'');});}
    DATA=d;$('gate').hidden=true;$('app').hidden=false;show('');
    var t='อัปเดต '+new Date(d.now).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    all('.upd').forEach(function(e){e.textContent=t;});
    var a=document.activeElement;
    if(first||!(a&&a.matches&&a.matches('[data-f],#fq')))render();
  }).catch(function(){
    if(!DATA&&first){$('gate').hidden=true;$('app').hidden=false;}
    show('โหลดข้อมูลไม่ได้ เช็กอินเทอร์เน็ตแล้วกดรีเฟรช');
  });
}
function post(body,apply){
  if(apply){apply();render();}
  $('busy').hidden=false;
  fetch(url(),{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.text();}).then(function(t){
    var r;try{r=JSON.parse(t);}catch(x){r={ok:false};}
    $('busy').hidden=true;
    if(!r.ok)show('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    load();
  }).catch(function(){$('busy').hidden=true;show('บันทึกไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วลองใหม่');load();});
}
function who(){return ME;}

/* ---------- วาดหน้า ---------- */
function navHtml(){
  var n2=DATA?DATA.jobs.filter(function(j){return followWhy(j);}).length:0;
  var n3=DATA?lostList().filter(function(j){return j.status!=='ยกเลิก';}).length:0;
  return TABS.map(function(t){var c=t.n===2?n2:t.n===3?n3:0;
    return '<button class="nav'+(t.n===TAB?' on':'')+'" data-tab="'+t.n+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+t.i+'</svg><span>'+t.t+'</span><i>'+(c||'')+'</i></button>';}).join('');
}
function render(){
  $('navs').innerHTML=navHtml();$('tabs').innerHTML=navHtml();
  var t=TABS[TAB-1];$('ttl').textContent=t.t;$('sub').textContent=t.s;
  for(var i=1;i<=4;i++)$('p'+i).hidden=i!==TAB;
  if(TAB===1)board();else if(TAB===2)follow();else if(TAB===3)lost();else summary();
  drawer();
}
function setTab(n){TAB=n;if(DATA)render();window.scrollTo(0,0);}

function opts(el,first,list,val){el.innerHTML=first+list.map(function(s){return '<option'+(s===val?' selected':'')+'>'+esc(s)+'</option>';}).join('');}
function uniq(f){var o={};DATA.jobs.forEach(function(j){var v=f(j);if(v)o[v]=1;});return Object.keys(o).sort();}
function dateRange(){
  var now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),day=864e5;
  switch(FIL.dr){
    case 'today':return [d0,d0+day];
    case '7':return [d0-6*day,d0+day];
    case '30':return [d0-29*day,d0+day];
    case 'month':return [new Date(now.getFullYear(),now.getMonth(),1).getTime(),d0+day];
    case 'lastmonth':return [new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),new Date(now.getFullYear(),now.getMonth(),1).getTime()];
    case 'custom':
      var a=FIL.d1?new Date(FIL.d1+'T00:00:00').getTime():0,b=FIL.d2?new Date(FIL.d2+'T00:00:00').getTime()+day:Infinity;
      return (a||b!==Infinity)?[a,b]:null;
  }
  return null;
}
function board(){
  opts($('fs'),'<option value="">ทุกที่มา</option>',uniq(function(j){return j.source;}),FIL.src);
  opts($('fo'),'<option value="">ทุกผู้ดูแล</option>',uniq(function(j){return j.owner;}),FIL.own);
  opts($('ft'),'<option value="">ทุก Supplier</option><option value="-"'+(FIL.team==='-'?' selected':'')+'>ยังไม่ระบุ Supplier</option>',uniq(function(j){return j.team;}),FIL.team);
  $('ft').hidden=!!DATA.scoped;
  $('fd').value=FIL.dr;$('fdk').value=FIL.dk;$('fdk').hidden=!FIL.dr;$('fdc').hidden=FIL.dr!=='custom';$('fd1').value=FIL.d1;$('fd2').value=FIL.d2;
  var rg=dateRange(), q=FIL.q.toLowerCase();
  var jobs=DATA.jobs.filter(function(j){
    if(FIL.hide&&!isOpen(j))return false;
    if(FIL.src&&j.source!==FIL.src)return false;
    if(FIL.own==='-'&&j.owner)return false;
    if(FIL.own&&FIL.own!=='-'&&j.owner!==FIL.own)return false;
    if(FIL.team==='-'&&j.team)return false;
    if(FIL.team&&FIL.team!=='-'&&j.team!==FIL.team)return false;
    if(rg){var t=FIL.dk==='touch'?touch(j):ms(j[FIL.dk]);if(!t||t<rg[0]||t>=rg[1])return false;}
    if(q&&(j.customer+' '+j.title+' '+j.needs+' '+j.quote).toLowerCase().indexOf(q)<0)return false;
    return true;});
  var active=FIL.q||FIL.src||FIL.own||FIL.team||FIL.dr;
  $('fclr').hidden=!active;$('fcount').textContent=active?'พบ '+jobs.length+' งาน':'';
  var cols=DATA.statuses.filter(function(s){return !(FIL.hide&&(s==='เสร็จ'||s==='ยกเลิก'));});
  var by={};cols.forEach(function(s){by[s]=jobs.filter(function(j){return j.status===s;}).sort(function(a,b){return (b.urgent-a.urgent)||(touch(b)-touch(a));});});
  if(cols.indexOf(FIL.col)<0||(!FIL.colPicked&&!by[FIL.col].length))FIL.col=cols.filter(function(s){return by[s].length;})[0]||cols[0];
  $('colchips').innerHTML=cols.map(function(s){return '<button class="chip'+(s===FIL.col?' on':'')+'" data-col="'+esc(s)+'">'+esc(s)+'<b>'+by[s].length+'</b></button>';}).join('');
  $('board').innerHTML=cols.map(function(s){var l=by[s];var sum=l.reduce(function(a,j){return a+(j.amount||0);},0);
    return '<div class="col'+(s===FIL.col?' cur':'')+'"><h3>'+esc(s)+'<b>'+l.length+'</b>'+(sum?'<em>'+baht(sum)+'</em>':'')+'</h3>'+(l.map(card).join('')||'<div class="empty">ยังไม่มีงานในขั้นนี้</div>')+'</div>';}).join('');
}
function card(j){
  var why=followWhy(j),s=silent(j);
  var cls='job'+(!isOpen(j)?' f':j.urgent?' u':why?' s':'');
  var tg=(j.urgent?'<span class="pill r">รีบ</span>':'')+(why&&why!=='ต้องรีบดู'?'<span class="pill '+whyCls(why)+'">'+esc(why)+'</span>':'')
   +(j.amount?'<span class="pill g">'+amtLbl()+baht(j.amount)+'</span>':'')+(DATA.admin&&j.profit?'<span class="pill">กำไร '+baht(j.profit)+'</span>':'')+(j.quote?'<span class="pill k">'+esc(j.quote)+'</span>':'')
   +(j.source&&j.source!==PROD?'<span class="pill">'+esc(j.source)+'</span>':'')+(j.team?'<span class="pill">'+esc(j.team)+'</span>':'');
  var mt=[];if(s!==null)mt.push('คุยล่าสุด '+agoTxt(touch(j)));if(j.due)mt.push('กำหนด '+j.due);mt.push('ดูแลโดย '+j.owner);
  return '<button class="'+cls+'" data-open="'+esc(j.jobId)+'"><div class="cu">'+esc(j.customer)+'</div><div class="ti">'+esc(j.title)+'</div><div class="tg">'+tg+'</div><div class="mt">'+esc(mt.join(' · '))+'</div></button>';
}

function follow(){
  var l=DATA.jobs.filter(function(j){return followWhy(j);}).sort(function(a,b){
    var sa=silent(a),sb=silent(b);return (b.urgent-a.urgent)||((sb===null?-1:sb)-(sa===null?-1:sa));});
  var cnt={};l.forEach(function(j){var w=followWhy(j);cnt[w]=(cnt[w]||0)+1;});
  var mine=l.filter(function(j){return who()&&j.owner===who();}).length;
  if(WHY&&WHY!=='@me'&&!cnt[WHY])WHY='';
  var chip=function(v,t,n){return '<button class="chip'+(WHY===v?' on':'')+'" data-why="'+esc(v)+'">'+esc(t)+'<b>'+n+'</b></button>';};
  var h='<div class="chips">'+chip('','ทั้งหมด',l.length)+(who()?chip('@me','ของ '+who(),mine):'')
    +Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).map(function(w){return chip(w,w,cnt[w]);}).join('')+'</div>';
  var v=l.filter(function(j){return !WHY||(WHY==='@me'?j.owner===who():followWhy(j)===WHY);});
  h+='<div class="rows">'+(v.map(function(j){var s=silent(j),id=esc(j.jobId),w=followWhy(j);
    return '<div class="row"><div class="why"><span class="pill '+whyCls(w)+'">'+esc(w)+'</span></div>'
     +'<div class="who"><b>'+esc(j.customer)+'</b><span>'+esc(j.title)+'</span><div class="sub">'+esc([j.source,j.status].filter(Boolean).join(' · '))
     +(s!==null?' · <span class="days'+(s>=LOST_DAYS?' hot':'')+'">เงียบ '+Math.floor(s)+' วัน</span>':'')+(j.followed?' · ตามล่าสุด '+agoTxt(ms(j.followed)):'')+'</div></div>'
     +'<div>'+ownerSel(j)+'</div>'
     +'<div class="amt">'+(j.amount?amtLbl()+baht(j.amount):'')+'</div>'
     +'<div class="act"><button class="btn sm red" data-act="followed" data-id="'+id+'">ตามแล้ว</button><button class="btn sm" data-open="'+id+'">เปิดดู</button></div></div>';}).join('')
    ||'<div class="empty">ไม่มีงานที่ต้องตามในกลุ่มนี้</div>')+'</div>';
  
  $('p2').innerHTML=h;
}

function kpis(k){return '<div class="kpis">'+k.map(function(x){return '<div class="kpi '+x[2]+'"><div class="n'+(String(x[0]).length>7?' sm':'')+'">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>';}).join('')+'</div>';}
function lost(){
  var leads=DATA.jobs.filter(function(j){return j.source!==PROD;});
  var l=lostList().sort(function(a,b){return (silent(b)||0)-(silent(a)||0);});
  var open=l.filter(function(j){return j.status!=='ยกเลิก';});
  var noAns=open.filter(function(j){return leadKind(j)==='ไม่มีคนตอบ';}).length;
  var quoted=open.filter(function(j){return j.status==='เสนอราคา';});
  var sumQ=quoted.reduce(function(a,j){return a+(j.amount||0);},0);
  var h=kpis([[leads.length,'ลูกค้าที่ทักเข้ามาทั้งหมด',''],[open.length,'เงียบเกิน '+LOST_DAYS+' วัน','warm'],[noAns,'ทักมาแล้วยังไม่มีคนตอบ','hot'],[quoted.length,'เสนอราคาแล้วเงียบ'+(sumQ?' รวม '+baht(sumQ):''),'warm'],[l.length-open.length,'ปิดเป็นยกเลิกแล้ว','']]);
  var rc={};l.forEach(function(j){var r=j.reason||'ยังไม่ระบุเหตุผล';rc[r]=(rc[r]||0)+1;});
  var mx=Math.max.apply(null,Object.keys(rc).map(function(r){return rc[r];}).concat([1]));

/* ---------- ระยะเวลา ---------- */
var WON=['กำลังผลิต','รอติดตั้ง','วางบิล/รอเงิน','เสร็จ'];
function days(a,b){var x=ms(a),y=b?ms(b):Date.now();return x&&y&&y>=x?(y-x)/864e5:null;}
function realDates(j){return j.groupId!=='import';}   // งานที่นำเข้าจากไลน์ครั้งแรกใช้วันที่นำเข้าแทนวันจริง
function avg(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function dTxt(n){return n===null?'-':n<1?'ไม่ถึง 1 วัน':Math.round(n)+' วัน';}
function dShort(iso){var t=ms(iso);return t?new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short'}):'-';}
function dInput(iso){var t=ms(iso);if(!t)return '';var d=new Date(t+7*36e5);return d.toISOString().slice(0,10);}
function cycle(J){
  var q=[],p=[],t=[];
  J.filter(realDates).forEach(function(j){
    if(j.wonAt&&j.source!==PROD){var a=days(j.opened,j.wonAt);if(a!==null)q.push(a);}
    if(j.status==='เสร็จ'&&j.wonAt&&j.closedAt&&ms(j.wonAt)!==ms(j.closedAt)){var b=days(j.wonAt,j.closedAt);if(b!==null)p.push(b);}
    if(j.status==='เสร็จ'&&j.closedAt){var c=days(j.opened,j.closedAt);if(c!==null)t.push(c);}
  });
  return {quote:avg(q),nq:q.length,prod:avg(p),np:p.length,total:avg(t),nt:t.length};
}

  if(!job.customer||!job.title)return;
  $('dlg').close();post(job);
});
